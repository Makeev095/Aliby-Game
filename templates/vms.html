<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Наблюдение</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10140f;
      --panel: #181d16;
      --line: #2c3428;
      --text: #e7ecdf;
      --muted: #9aa592;
      --accent: #d6f16a;
      --accent-ink: #1a2208;
      --danger: #ff8d7a;
      --live: #8ee08a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 "Segoe UI", sans-serif; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
    header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 18px; letter-spacing: 0.04em; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    .spacer { flex: 1; }
    .layouts { display: flex; gap: 6px; }
    .layouts button, .ghost, .primary { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 7px 10px; }
    .layouts button[aria-pressed="true"], .primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 650; }
    .workspace { display: grid; grid-template-columns: 300px 1fr 240px; min-height: 0; }
    .panel { border-right: 1px solid var(--line); padding: 14px; overflow: auto; }
    .panel.right { border-right: 0; border-left: 1px solid var(--line); }
    .stage { min-width: 0; min-height: 0; padding: 12px; display: grid; gap: 8px; background: #0b0e0a; }
    .stage[data-layout="1"] { grid-template-columns: 1fr; }
    .stage[data-layout="4"] { grid-template-columns: 1fr 1fr; }
    .stage[data-layout="9"] { grid-template-columns: 1fr 1fr 1fr; }
    .tile { position: relative; background: #050605; border: 1px solid #222; min-height: 140px; overflow: hidden; }
    .tile.selected { outline: 2px solid var(--accent); }
    .tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .tile figcaption { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .empty { margin: auto; color: var(--muted); text-align: center; padding: 24px; }
    form { display: grid; gap: 8px; margin-bottom: 16px; }
    label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
    input { background: #0e120d; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .device { width: 100%; text-align: left; background: #121710; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
    .device strong { display: block; }
    .device span, .hint, .status { color: var(--muted); font-size: 12px; }
    .device.active { border-color: var(--accent); }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .danger { color: var(--danger); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
    .dot.on { background: var(--live); }
    .pad { display: grid; grid-template-columns: repeat(3, 52px); gap: 6px; justify-content: center; margin: 12px 0; }
    .pad button { height: 44px; border-radius: 8px; border: 1px solid var(--line); background: #121710; }
    .meta { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
    .meta b { color: var(--text); font-weight: 600; }
    nav { display: none; border-top: 1px solid var(--line); }
    nav button { flex: 1; background: transparent; border: 0; padding: 12px; color: var(--muted); }
    nav button[aria-pressed="true"] { color: var(--accent); }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .panel { display: none; border: 0; }
      .panel.show { display: block; }
      .stage { display: none; }
      .stage.show { display: grid; }
      nav { display: flex; }
      header .layouts { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Наблюдение</h1>
        <p>Серийный номер и пароль вашего регистратора</p>
      </div>
      <div class="spacer"></div>
      <div class="layouts" role="group" aria-label="Сетка">
        <button type="button" data-layout="1" aria-pressed="true">1</button>
        <button type="button" data-layout="4">4</button>
        <button type="button" data-layout="9">9</button>
      </div>
    </header>
    <div class="workspace">
      <aside class="panel show" id="devices-panel">
        <form id="add-form">
          <label>Имя<input name="name" maxlength="40" placeholder="Дом"></label>
          <label>Серийный номер<input name="serial" required autocomplete="off" spellcheck="false" placeholder="из меню Info → Version"></label>
          <label>Пользователь<input name="user" required value="admin" autocomplete="username"></label>
          <label>Пароль<input name="password" type="password" autocomplete="current-password"></label>
          <label>Адрес, если не в этой сети<input name="host" placeholder="192.168.1.253:34567"></label>
          <button class="primary" type="submit">Добавить</button>
          <p class="hint" id="form-error"></p>
        </form>
        <div id="device-list"></div>
      </aside>
      <main class="stage" id="stage" data-layout="1">
        <p class="empty" id="placeholder">Добавьте регистратор слева и нажмите «Открыть».</p>
      </main>
      <aside class="panel right" id="control-panel">
        <h2>Канал</h2>
        <p class="status" id="channel-label">Канал не выбран</p>
        <div class="pad" aria-label="Поворот">
          <span></span>
          <button type="button" data-ptz="up">↑</button>
          <span></span>
          <button type="button" data-ptz="left">←</button>
          <button type="button" data-ptz="zoom_in">+</button>
          <button type="button" data-ptz="right">→</button>
          <span></span>
          <button type="button" data-ptz="down">↓</button>
          <button type="button" data-ptz="zoom_out">−</button>
        </div>
        <p class="hint">Одно нажатие — короткий шаг. Камера без привода команду проигнорирует.</p>
        <div class="meta" id="info"></div>
        <p class="danger" id="ptz-error"></p>
      </aside>
    </div>
    <nav>
      <button type="button" data-tab="devices" aria-pressed="true">Устройства</button>
      <button type="button" data-tab="live">Просмотр</button>
      <button type="button" data-tab="control">Управление</button>
    </nav>
  </div>
  <script src="/static/h264.js"></script>
  <script>
    const state = { devices: [], current: null, channel: 0, layout: 1 };
    const players = [];
    const list = document.querySelector("#device-list");
    const stage = document.querySelector("#stage");
    const formError = document.querySelector("#form-error");
    const info = document.querySelector("#info");
    const channelLabel = document.querySelector("#channel-label");
    const ptzError = document.querySelector("#ptz-error");

    function showTab(name) {
      document.querySelectorAll("nav button").forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.tab === name ? "true" : "false");
      });
      document.querySelector("#devices-panel").classList.toggle("show", name === "devices");
      stage.classList.toggle("show", name === "live");
      document.querySelector("#control-panel").classList.toggle("show", name === "control");
    }

    document.querySelectorAll("nav button").forEach((button) => {
      button.addEventListener("click", () => showTab(button.dataset.tab));
    });

    document.querySelectorAll(".layouts button").forEach((button) => {
      button.addEventListener("click", () => {
        state.layout = Number(button.dataset.layout);
        document.querySelectorAll(".layouts button").forEach((item) => {
          item.setAttribute("aria-pressed", item === button ? "true" : "false");
        });
        renderStage();
      });
    });

    async function refresh() {
      const response = await fetch("/api/devices");
      state.devices = await response.json();
      if (state.current) {
        const fresh = state.devices.find((item) => item.id === state.current.id);
        if (fresh) state.current = fresh;
      }
      renderList();
      renderInfo();
    }

    function renderList() {
      list.replaceChildren();
      if (!state.devices.length) {
        const note = document.createElement("p");
        note.className = "hint";
        note.textContent = "Пока пусто. Серийный номер берётся в меню регистратора: Info → Version.";
        list.appendChild(note);
        return;
      }
      for (const device of state.devices) {
        const card = document.createElement("article");
        card.className = "device" + (state.current && state.current.id === device.id ? " active" : "");
        const title = document.createElement("strong");
        const dot = document.createElement("i");
        dot.className = "dot" + (device.online ? " on" : "");
        title.append(dot, document.createTextNode(device.name));
        const serial = document.createElement("span");
        serial.textContent = device.serial + (device.host ? " · " + device.host : " · эта сеть");
        const actions = document.createElement("div");
        actions.className = "row";
        const open = document.createElement("button");
        open.type = "button";
        open.className = "primary";
        open.textContent = device.online ? "Обновить" : "Открыть";
        open.addEventListener("click", () => connect(device.id, open));
        actions.appendChild(open);
        if (device.source !== "env") {
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "ghost";
          remove.textContent = "Удалить";
          remove.addEventListener("click", () => removeDevice(device.id));
          actions.appendChild(remove);
        }
        card.append(title, serial, actions);
        if (device.error) {
          const error = document.createElement("p");
          error.className = "danger";
          error.textContent = device.error;
          card.appendChild(error);
        }
        list.appendChild(card);
      }
    }

    function stopPlayers() {
      while (players.length) players.pop()();
    }

    function renderStage() {
      const device = state.current;
      stopPlayers();
      stage.dataset.layout = String(state.layout);
      stage.replaceChildren();
      if (!device || !device.online) {
        const note = document.createElement("p");
        note.className = "empty";
        note.id = "placeholder";
        note.textContent = device && device.error ? device.error : "Добавьте регистратор слева и нажмите «Открыть».";
        stage.appendChild(note);
        return;
      }
      const channels = device.channels.slice(0, state.layout);
      if (!channels.length) {
        const note = document.createElement("p");
        note.className = "empty";
        note.textContent = "Регистратор открыт, каналов нет.";
        stage.appendChild(note);
        return;
      }
      channels.forEach((channel) => {
        const tile = document.createElement("figure");
        tile.className = "tile" + (channel.index === state.channel ? " selected" : "");
        const canvas = document.createElement("canvas");
        const caption = document.createElement("figcaption");
        caption.textContent = channel.name + (channel.online ? "" : " · нет сигнала");
        tile.append(canvas, caption);
        players.push(playH264(canvas, `/stream/${device.id}/${channel.index}`));
        tile.addEventListener("click", () => {
          state.channel = channel.index;
          renderStage();
          renderInfo();
        });
        stage.appendChild(tile);
      });
    }

    function renderInfo() {
      const device = state.current;
      const channel = device && device.channels ? device.channels[state.channel] : null;
      channelLabel.textContent = channel ? channel.name : "Канал не выбран";
      info.replaceChildren();
      if (!device || !device.info) return;
      const rows = [
        ["Модель", device.info.model],
        ["Прошивка", device.info.software],
        ["Работает", device.info.runtime],
      ];
      for (const [label, value] of rows) {
        if (!value) continue;
        const line = document.createElement("div");
        line.innerHTML = "";
        const name = document.createElement("div");
        name.textContent = label;
        const text = document.createElement("b");
        text.textContent = value;
        line.append(name, text);
        info.appendChild(line);
      }
    }

    async function connect(id, button) {
      button.disabled = true;
      const previous = button.textContent;
      button.textContent = "Ищу…";
      ptzError.textContent = "";
      const response = await fetch(`/api/devices/${id}/open`, { method: "POST" });
      const device = await response.json();
      state.current = device;
      state.channel = 0;
      button.disabled = false;
      button.textContent = previous;
      await refresh();
      renderStage();
      if (window.matchMedia("(max-width: 900px)").matches && device.online) showTab("live");
    }

    async function removeDevice(id) {
      await fetch(`/api/devices/${id}`, { method: "DELETE" });
      if (state.current && state.current.id === id) {
        state.current = null;
        renderStage();
      }
      await refresh();
    }

    document.querySelector("#add-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      formError.textContent = "";
      const form = event.currentTarget;
      const payload = Object.fromEntries(new FormData(form).entries());
      const response = await fetch("/api/devices", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const body = await response.json();
      if (!response.ok) {
        formError.textContent = body.error || "Не удалось сохранить";
        return;
      }
      form.reset();
      form.user.value = "admin";
      await refresh();
    });

    document.querySelectorAll("[data-ptz]").forEach((button) => {
      button.addEventListener("click", async () => {
        ptzError.textContent = "";
        if (!state.current || !state.current.online) {
          ptzError.textContent = "Сначала откройте регистратор.";
          return;
        }
        const response = await fetch(`/api/devices/${state.current.id}/ptz`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ channel: state.channel, command: button.dataset.ptz }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          ptzError.textContent = body.error || "Команда не выполнилась";
        }
      });
    });

    refresh().catch(() => {
      formError.textContent = "Страница не достучалась до программы.";
    });
  </script>
</body>
</html>
